<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARG Data · Review Queue</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f6;margin:0}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:6px 10px;border:1px solid #39414b;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}.card{background:#14181d;border:1px solid #29313a;border-radius:16px;padding:18px}.status{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.ready{color:#64d98b}.research{color:#f2c94c}.blocked{color:#ff7b72}.claim{font-size:20px;line-height:1.25;margin:12px 0}.meta{color:#9aa7b4;font-size:14px}.reply{background:#0d1117;padding:12px;border-radius:10px;margin:14px 0;font-size:14px}.actions{display:flex;gap:8px}button{padding:9px 12px;border-radius:9px;border:0;font-weight:650}button.primary{background:#eef2f6;color:#0b0d10}button.secondary{background:#252c34;color:#eef2f6}</style></head><body><div class="wrap"><div class="top"><div><h1>ARG Data</h1><div class="meta">Review Queue · evidencia antes que relato</div></div><span class="badge">Human approval ON</span></div><div id="queue" class="grid"></div></div><script>const items=[{id:'ARG-000001',status:'READY_FOR_REVIEW',score:92,claim:'Argentina quebró porque la deuda externa supera ampliamente las reservas y no podrá pagar hasta 2032.',verdict:'ENGAÑOSO',confidence:96,reply:'🟠 ENGAÑOSO. Comparar el stock total de deuda externa con reservas brutas no demuestra insolvencia ni incapacidad de atender vencimientos. Hay que analizar plazos, servicio de deuda, flujos y refinanciación.'},{id:'ARG-000002',status:'RESEARCHING',score:89,claim:'Argentina no está en recesión y los indicadores desestacionalizados están midiendo mal.',verdict:'PENDIENTE',confidence:null},{id:'ARG-000003',status:'RESEARCHING',score:84,claim:'Durante este gobierno se crearon más de 500 mil puestos de trabajo.',verdict:'PENDIENTE',confidence:null},{id:'ARG-000004',status:'RESEARCHING',score:91,claim:'La probabilidad de default que el mercado asigna al Gobierno es cero, literalmente.',verdict:'PENDIENTE',confidence:null}];function cls(s){return s==='READY_FOR_REVIEW'?'ready':s==='BLOCKED'?'blocked':'research'}document.querySelector('#queue').innerHTML=items.map(x=>`<article class="card"><div class="status ${cls(x.status)}">${x.status.replaceAll('_',' ')}</div><div class="claim">${x.claim}</div><div class="meta">${x.id} · Opportunity ${x.score}/100 ${x.confidence?'· Confidence '+x.confidence+'%':''}</div><h3>${x.verdict}</h3>${x.reply?`<div class="reply">${x.reply}</div>`:''}<div class="actions"><button class="secondary">Evidencia</button>${x.status==='READY_FOR_REVIEW'?'<button class="primary">Aprobar respuesta</button>':'<button class="secondary">Ver investigación</button>'}</div></article>`).join('');</script></body></html>
