<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARG Data · Review Queue</title><style>body{font-family:system-ui;background:#0b0d10;color:#eef2f6;margin:0}.wrap{max-width:1100px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:6px 10px;border:1px solid #39414b;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:24px}.card{background:#14181d;border:1px solid #29313a;border-radius:16px;padding:18px}.status{font-size:12px;text-transform:uppercase;letter-spacing:.08em}.ready{color:#64d98b}.research{color:#f2c94c}.blocked{color:#ff7b72}.claim{font-size:20px;line-height:1.25;margin:12px 0}.meta{color:#9aa7b4;font-size:14px}.reply{background:#0d1117;padding:12px;border-radius:10px;margin:14px 0;font-size:14px}.actions{display:flex;gap:8px}button,a.btn{padding:9px 12px;border-radius:9px;border:0;font-weight:650;text-decoration:none}button.primary{background:#eef2f6;color:#0b0d10}button.secondary,a.btn{background:#252c34;color:#eef2f6}.error{color:#ff7b72}</style></head><body><div class="wrap"><div class="top"><div><h1>ARG Data</h1><div class="meta">Review Queue · evidencia antes que relato</div></div><span class="badge">Human approval ON</span></div><div id="stamp" class="meta"></div><div id="queue" class="grid">Cargando…</div></div><script>function cls(s){return s==='READY_FOR_REVIEW'?'ready':s==='BLOCKED'?'blocked':'research'}function render(items){document.querySelector('#queue').innerHTML=items.map(x=>`<article class="card"><div class="status ${cls(x.status)}">${x.status.replaceAll('_',' ')}</div><div class="claim">${x.claim}</div><div class="meta">${x.id} · Opportunity ${x.score}/100 ${x.confidence?`· Confidence ${Math.round(x.confidence*100)}%`:''}</div><h3>${x.verdict}</h3>${x.reply?`<div class="reply">${x.reply}</div>`:''}<div class="actions">${x.evidence_path?`<a class="btn" href="${x.evidence_path}" target="_blank">Evidencia</a>`:'<button class="secondary">Ver investigación</button>'}${x.status==='READY_FOR_REVIEW'?'<button class="primary" title="Publicación en X se habilita al conectar credenciales">Aprobar respuesta</button>':''}</div></article>`).join('')}fetch('./queue.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('queue unavailable');return r.json()}).then(data=>{document.querySelector('#stamp').textContent=`Actualizado ${data.generated_at} · ${data.items.length} expedientes`;render(data.items)}).catch(e=>{document.querySelector('#queue').innerHTML='<div class="error">No se pudo cargar queue.json</div>'})</script></body></html>
